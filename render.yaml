# Render Blueprint: one Docker web service with a persistent disk for data/.
# In Render: New → Blueprint → pick this repo. You'll be asked for APIFY_TOKEN
# (it's never stored in the repo). A disk needs a paid instance (Starter).
services:
  - type: web
    name: insta-snapshot
    runtime: docker
    plan: starter
    autoDeploy: true
    disk:
      name: snapshot-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: APIFY_TOKEN
        sync: false
      - key: RECOMMENDATIONS_DAILY_LIMIT
        value: "20"
